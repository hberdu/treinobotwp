<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Classificação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060608;
      --surface: #0c0c10;
      --surface-2: #14141a;
      --surface-3: #1d1d25;
      --border: #20202a;
      --text: #f4f4f6;
      --text-dim: #b4b4c0;
      --text-soft: #7a7a86;
      --accent: #c0ff3e;
      --c-lime: #c0ff3e;
      --c-cyan: #22d3ee;
      --c-magenta: #f472b6;
      --c-amber: #fbbf24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "cv02","cv03","cv11","ss01";
    }
    .mono { font-family: "JetBrains Mono", monospace; }

    .card {
      width: 1100px;
      background:
        radial-gradient(ellipse 60% 50% at 100% 0%, color-mix(in oklab, var(--c-lime) 10%, transparent), transparent 60%),
        radial-gradient(ellipse 50% 40% at 0% 100%, color-mix(in oklab, var(--c-magenta) 8%, transparent), transparent 60%),
        var(--surface);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 1.5rem;
      position: relative;
      margin: 0 auto;
    }

    .brackets::before, .brackets::after {
      content: "";
      position: absolute;
      width: 22px; height: 22px;
      border: 2.4px solid var(--accent);
    }
    .brackets::before { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
    .brackets::after  { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }

    /* GRID 2 COLUNAS — column-flow vertical (1/8, 2/9, 3/10...) */
    .list {
      column-count: 2;
      column-gap: 1.1rem;
    }
    .row {
      break-inside: avoid;
      page-break-inside: avoid;
      -webkit-column-break-inside: avoid;
      display: grid;
      grid-template-columns: 60px 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1.1rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: .7rem;
      position: relative;
      overflow: hidden;
    }
    .row::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      background: var(--athlete-color);
    }

    /* ===== MEDALHAS OUTLINED ===== */
    .medal {
      display: inline-flex; align-items: center; justify-content: center;
      width: 54px; height: 54px;
      border-radius: 50%;
      background: transparent;
      color: var(--text-dim);
      font-size: 1.5rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
      border: 1.8px solid var(--border);
      font-family: "Space Grotesk", sans-serif;
    }
    .medal.podium { border-width: 2.2px; }
    .medal.gold   { border-color: #d4af37; color: #d4af37; }
    .medal.silver { border-color: #b8c0c8; color: #b8c0c8; }
    .medal.bronze { border-color: #b87333; color: #b87333; }

    .main {
      display: flex; flex-direction: column;
      gap: .55rem;
      min-width: 0;
    }
    .name {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--text);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .progress {
      display: flex; align-items: center; gap: .7rem;
    }
    .progress .track {
      flex: 1;
      height: 7px;
      background: var(--surface-3);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress .fill {
      height: 100%;
      background: var(--athlete-color);
      border-radius: 999px;
    }
    .progress .fill.full {
      background: linear-gradient(90deg, #4ade80, var(--c-lime));
    }
    .progress .pct {
      font-family: "JetBrains Mono", monospace;
      font-size: .95rem;
      color: var(--text-soft);
      min-width: 46px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    /* ===== STATS ===== */
    .stats {
      display: flex; flex-direction: column;
      gap: .55rem;
      padding-left: .25rem;
      align-items: flex-end;
    }
    .stats-row {
      display: flex; align-items: baseline;
      gap: 1.4rem;
      line-height: 1;
    }
    .stat {
      display: flex; flex-direction: column;
      align-items: flex-end;
      gap: .25rem;
      line-height: 1;
    }
    .stat-title {
      font-family: "JetBrains Mono", monospace;
      font-size: .75rem;
      color: var(--text-soft);
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .stat-val {
      font-family: "Space Grotesk", sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -.025em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .stat-val.lime { color: var(--c-lime); }
    .stat-val.cyan { color: var(--c-cyan); }

    .week-line {
      display: flex; align-items: baseline; gap: .55rem;
      font-family: "Space Grotesk", sans-serif;
      line-height: 1;
    }
    .week-line .v {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
    }
    .week-line .v .div { color: var(--text-soft); font-weight: 500; margin: 0 .1rem; }
    .week-line .lbl {
      font-family: "JetBrains Mono", monospace;
      font-size: .75rem;
      color: var(--text-soft);
      letter-spacing: .14em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card brackets">
    <div class="list" id="list"></div>
  </div>

  <script>
    const PALETTE = [
      "#c0ff3e", "#22d3ee", "#f472b6", "#fbbf24", "#a78bfa",
      "#fb923c", "#34d399", "#60a5fa", "#fb7185", "#facc15",
      "#c084fc", "#2dd4bf", "#f87171", "#86efac", "#93c5fd",
      "#fcd34d", "#f9a8d4", "#7dd3fc", "#bef264", "#fda4af",
    ];
    function hashCode(s) { let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0; return Math.abs(h); }
    function colorFor(n) { return PALETTE[hashCode(String(n)) % PALETTE.length]; }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    const TOKEN = new URLSearchParams(location.search).get("token") || "";
    async function fetchData() {
      const url = TOKEN ? `/api/dashboard?token=${encodeURIComponent(TOKEN)}` : "/api/dashboard";
      const res = await fetch(url, { headers: TOKEN ? { "x-dashboard-token": TOKEN } : {} });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    function render(data) {
      const list = document.getElementById("list");
      list.innerHTML = "";

      const ordenados = [...(data.atletas || [])].sort((a, b) => {
        if (b.progressoSemanal !== a.progressoSemanal) return b.progressoSemanal - a.progressoSemanal;
        return b.treinos - a.treinos;
      });

      ordenados.forEach((a, i) => {
        const pct = a.meta > 0 ? Math.min(100, Math.round((a.progresso / a.meta) * 100)) : 0;
        const podium = i < 3;
        const medalClass = i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "";
        const col = colorFor(a.nome);

        const row = document.createElement("div");
        row.className = "row";
        row.style.setProperty("--athlete-color", col);
        row.innerHTML = `
          <span class="medal ${podium ? "podium " + medalClass : ""}">${i + 1}</span>
          <div class="main">
            <div class="name">${escapeHtml(a.nome)}</div>
            <div class="progress">
              <div class="track"><div class="fill ${pct >= 100 ? "full" : ""}" style="width:${pct}%"></div></div>
              <span class="pct">${pct}%</span>
            </div>
          </div>
          <div class="stats">
            <div class="stats-row">
              <div class="stat">
                <span class="stat-title">Total</span>
                <span class="stat-val lime">${a.treinos}</span>
              </div>
              <div class="stat">
                <span class="stat-title">Sem ✓</span>
                <span class="stat-val cyan">${a.progressoSemanal}</span>
              </div>
            </div>
            <div class="week-line">
              <span class="v">${a.progresso}<span class="div">/</span>${a.meta}</span>
              <span class="lbl">semana</span>
            </div>
          </div>
        `;
        list.appendChild(row);
      });
    }

    (async () => {
      try {
        const data = await fetchData();
        render(data);
        await (document.fonts && document.fonts.ready);
        window.__rankingReady = true;
        document.body.dataset.ready = "1";
      } catch (err) {
        document.body.dataset.error = String(err && err.message || err);
      }
    })();
  </script>
</body>
</html>
