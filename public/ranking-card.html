<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Classificação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060608;
      --surface: #0c0c10;
      --surface-2: #14141a;
      --surface-3: #1d1d25;
      --border: #20202a;
      --text: #f4f4f6;
      --text-dim: #b4b4c0;
      --text-soft: #7a7a86;
      --accent: #c0ff3e;
      --c-lime: #c0ff3e;
      --c-cyan: #22d3ee;
      --c-magenta: #f472b6;
      --c-amber: #fbbf24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "cv02","cv03","cv11","ss01";
    }
    .mono { font-family: "JetBrains Mono", monospace; }

    /* Card mais quadrado: WhatsApp não corta imagens próximas de 1:1 / 4:5 */
    .card {
      width: 900px;
      background:
        radial-gradient(ellipse 60% 50% at 100% 0%, color-mix(in oklab, var(--c-lime) 12%, transparent), transparent 60%),
        radial-gradient(ellipse 50% 40% at 0% 100%, color-mix(in oklab, var(--c-magenta) 10%, transparent), transparent 60%),
        var(--surface);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 2rem 2rem 1.6rem;
      position: relative;
      margin: 0 auto;
    }

    .brackets::before, .brackets::after {
      content: "";
      position: absolute;
      width: 22px; height: 22px;
      border: 2.4px solid var(--accent);
    }
    .brackets::before { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
    .brackets::after  { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }

    .head {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 1.25rem;
      gap: 1rem;
    }
    .head h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -.03em;
      margin: 0;
      line-height: 1;
    }
    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: .82rem;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: .16em;
      margin-bottom: .4rem;
    }
    .eyebrow::before { content: "// "; opacity: .55; }
    .meta {
      text-align: right;
      font-family: "JetBrains Mono", monospace;
      font-size: .9rem;
      color: var(--text-soft);
      letter-spacing: .1em;
      text-transform: uppercase;
      line-height: 1.5;
      white-space: nowrap;
    }
    .meta b { color: var(--text); font-weight: 600; font-size: 1rem; }

    /* GRID 2 COLUNAS (lado a lado) para reduzir altura */
    .list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .55rem 1rem;
    }

    .row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: .85rem;
      padding: .75rem .75rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 64px;
      position: relative;
    }
    .row::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--athlete-color);
      border-radius: 12px 0 0 12px;
    }

    .medal {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--surface-3);
      color: var(--text-dim);
      font-size: 1rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
      border: 1.5px solid var(--border);
      font-family: "Space Grotesk", sans-serif;
    }
    .medal.gold   { background: linear-gradient(135deg, #fde68a, #f59e0b); color: #422006; border-color: transparent; }
    .medal.silver { background: linear-gradient(135deg, #e5e7eb, #9ca3af); color: #111827; border-color: transparent; }
    .medal.bronze { background: linear-gradient(135deg, #fdba74, #c2410c); color: #1c0701; border-color: transparent; }

    .main {
      display: flex; flex-direction: column;
      gap: .35rem;
      min-width: 0;
    }
    .name {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -.015em;
      color: var(--text);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .progress {
      display: flex; align-items: center; gap: .5rem;
    }
    .progress .track {
      flex: 1;
      height: 5px;
      background: var(--surface-3);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress .fill {
      height: 100%;
      background: var(--athlete-color);
      border-radius: 999px;
    }
    .progress .fill.full {
      background: linear-gradient(90deg, #4ade80, var(--c-lime));
    }
    .progress .pct {
      font-family: "JetBrains Mono", monospace;
      font-size: .75rem;
      color: var(--text-soft);
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .stats {
      display: flex; flex-direction: column; align-items: flex-end;
      gap: .15rem;
      padding-left: .5rem;
    }
    .stat-main {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--athlete-color);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-sub {
      font-family: "JetBrains Mono", monospace;
      font-size: .65rem;
      color: var(--text-soft);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .foot {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-family: "JetBrains Mono", monospace;
      font-size: .78rem;
      color: var(--text-soft);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .foot .brand {
      display: flex; align-items: center; gap: .55rem;
      color: var(--text-dim);
    }
    .foot .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card brackets">
    <header class="head">
      <div>
        <div class="eyebrow">classificação · top atletas</div>
        <h1>Classificação</h1>
      </div>
      <div class="meta" id="meta">—</div>
    </header>

    <div class="list" id="list"></div>

    <footer class="foot">
      <div class="brand"><span class="dot"></span> treinos · 2026</div>
      <div id="generatedAt"></div>
    </footer>
  </div>

  <script>
    const PALETTE = [
      "#c0ff3e", "#22d3ee", "#f472b6", "#fbbf24", "#a78bfa",
      "#fb923c", "#34d399", "#60a5fa", "#fb7185", "#facc15",
      "#c084fc", "#2dd4bf", "#f87171", "#86efac", "#93c5fd",
      "#fcd34d", "#f9a8d4", "#7dd3fc", "#bef264", "#fda4af",
    ];
    function hashCode(s) { let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0; return Math.abs(h); }
    function colorFor(n) { return PALETTE[hashCode(String(n)) % PALETTE.length]; }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    const TOKEN = new URLSearchParams(location.search).get("token") || "";
    async function fetchData() {
      const url = TOKEN ? `/api/dashboard?token=${encodeURIComponent(TOKEN)}` : "/api/dashboard";
      const res = await fetch(url, { headers: TOKEN ? { "x-dashboard-token": TOKEN } : {} });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    function getWeekInfo(semanasAno) {
      const today = new Date();
      const start = new Date(today.getFullYear(), 0, 1);
      const diff = today - start;
      const weekNo = Math.floor(diff / (1000 * 60 * 60 * 24 * 7)) + 1;
      return { weekNo, total: semanasAno };
    }

    function render(data) {
      const sem = getWeekInfo(data.semanasNoAno || 52);
      document.getElementById("meta").innerHTML =
        `<b>Semana ${sem.weekNo}/${sem.total}</b>`;

      const list = document.getElementById("list");
      list.innerHTML = "";

      const ordenados = [...(data.atletas || [])].sort((a, b) => {
        if (b.progressoSemanal !== a.progressoSemanal) return b.progressoSemanal - a.progressoSemanal;
        return b.treinos - a.treinos;
      });

      ordenados.forEach((a, i) => {
        const pct = a.meta > 0 ? Math.min(100, Math.round((a.progresso / a.meta) * 100)) : 0;
        const medal = i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "";
        const col = colorFor(a.nome);

        const row = document.createElement("div");
        row.className = "row";
        row.style.setProperty("--athlete-color", col);
        row.innerHTML = `
          <span class="medal ${medal}">${i + 1}</span>
          <div class="main">
            <div class="name">${escapeHtml(a.nome)}</div>
            <div class="progress">
              <div class="track"><div class="fill ${pct >= 100 ? "full" : ""}" style="width:${pct}%"></div></div>
              <span class="pct">${pct}%</span>
            </div>
          </div>
          <div class="stats">
            <span class="stat-main">${a.progressoSemanal}</span>
            <span class="stat-sub">Sem ✓</span>
          </div>
        `;
        list.appendChild(row);
      });

      const now = new Date();
      document.getElementById("generatedAt").textContent =
        `${now.toLocaleDateString("pt-BR")} · ${now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`;
    }

    (async () => {
      try {
        const data = await fetchData();
        render(data);
        await (document.fonts && document.fonts.ready);
        window.__rankingReady = true;
        document.body.dataset.ready = "1";
      } catch (err) {
        document.body.dataset.error = String(err && err.message || err);
      }
    })();
  </script>
</body>
</html>
